<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content workspace</title><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"></head>
<body aria-busy="true"><div class="workspace">
<header class="topbar"><nav class="media-tabs" role="tablist"><button disabled hidden id="nav-copy" role="tab" class="nav-item" data-kind="copy" data-t="copy" aria-controls="create-page"></button><button disabled id="nav-image" role="tab" class="nav-item" data-kind="image" data-t="image" aria-controls="create-page"></button><button disabled id="nav-video" role="tab" class="nav-item" data-kind="video" data-t="video" aria-controls="create-page"></button><button disabled id="nav-audio" role="tab" class="nav-item" data-kind="audio" data-t="audio" aria-controls="create-page"></button><button disabled id="nav-library" role="tab" class="nav-item" data-t="library" aria-controls="library-page" aria-selected="false"></button></nav></header>
<main>
 <header class="page-head"><div class="hero-copy"><h1 id="page-title"></h1><p id="page-description"></p></div><div class="mode-art" aria-hidden="true"><span class="art-back"></span><span class="art-front"><span class="art-sun"></span><span class="art-land"></span><span class="art-play"></span><span class="art-wave"></span></span></div></header>
 <div id="notice" role="status" aria-live="polite"></div>
 <section id="create-page" role="tabpanel" aria-labelledby="nav-image">
  <div class="editor" id="editor">
   <section class="brief-panel">
    <label class="field prompt-field"><span class="sr-only" data-t="requirements"></span><textarea disabled id="brief" rows="4" maxlength="40000"></textarea></label>
    <div class="source-box"><div id="selected-assets"></div><div class="attachment-actions"><button disabled id="add-material" class="chat-attach-btn" aria-haspopup="menu" aria-controls="material-menu" aria-expanded="false"></button><span id="source-count" class="help" role="status"></span><span id="drop-materials" class="help" data-t="dropMaterials" hidden></span></div></div>
    <div id="material-menu" class="context-menu" role="menu" hidden><button disabled id="upload" class="context-menu-item" role="menuitem" tabindex="-1"><span class="context-menu-icon" data-icon="file" aria-hidden="true"></span><span data-t="localFiles"></span></button><button disabled id="open-library" class="context-menu-item" role="menuitem" tabindex="-1"><span class="context-menu-icon" data-icon="layers" aria-hidden="true"></span><span data-t="library"></span></button></div>
    <div class="composer-tools"><div class="fields"><div class="field" id="service-field"><div class="section-head"><span id="service-label"></span><button disabled id="refresh-services" type="button" class="text-button"></button></div><div id="service" aria-labelledby="service-label"></div><p id="service-state" class="help" role="status" hidden></p></div><div class="field" id="aspect-field"><span id="aspect-label" data-t="aspect"></span><div id="aspect" aria-labelledby="aspect-label"></div></div><label class="field" id="duration-field"><span data-t="duration"></span><input disabled id="duration" type="number" min="1" max="7200"></label><div class="field"><span id="format-label" data-t="format"></span><div id="format" aria-labelledby="format-label"></div></div></div></div>
    <div class="section-head availability"><p id="agent-state" class="help" role="status"></p><button disabled id="refresh-agents" data-t="refresh" hidden></button></div><div class="composer-footer"><span id="save-state" role="status"></span><div class="actions form-actions"><button disabled id="reset-work" data-t="reset"></button><button disabled id="submit" class="primary" data-t="start"></button></div></div>
   </section>

  </div>
  <section class="recent" id="records"><div class="section-head"><h2 data-t="works"></h2><span id="work-count" class="help"></span></div><div id="works-list" class="history-list"></div><p id="empty-works" class="empty" data-t="noWorks"></p><button disabled id="show-more" data-t="showMore" hidden></button></section>
 </section>
 <section id="library-page" role="tabpanel" aria-labelledby="nav-library" hidden>
  <div class="section-head library-toolbar"><label class="sr-only" for="library-search" data-t="searchLibrary"></label><input disabled id="library-search" type="search" data-placeholder="searchLibrary" maxlength="160"><div class="actions"><button disabled id="add-prompt" data-t="addPrompt"></button><button disabled id="library-upload" data-t="upload"></button></div></div>
  <div class="library-filters" role="group" id="library-filters"><button disabled data-filter="all" data-t="allMaterials" aria-pressed="true"></button><button disabled data-filter="bundle" data-t="bundles" aria-pressed="false"></button><button disabled data-filter="copy" data-t="prompts" aria-pressed="false"></button><button disabled data-filter="image" data-t="image" aria-pressed="false"></button><button disabled data-filter="audio" data-t="audio" aria-pressed="false"></button><button disabled data-filter="video" data-t="video" aria-pressed="false"></button></div>
  <div id="library-list" class="library-grid"></div><p id="library-empty" class="empty" data-t="emptyLibrary"></p><button disabled id="library-more" data-t="showMore" hidden></button>
  <div class="library-footer"><div class="library-selection-actions" id="library-selection" hidden><span id="library-selected-count" role="status"></span><button disabled id="clear-selection" class="text-button" data-t="clearSelection"></button><div class="actions"><button disabled id="save-selection" data-t="saveBundle"></button><button disabled id="remove-selection" class="danger" data-t="remove"></button></div></div><div class="actions library-use-actions"><span id="library-target-label" data-t="useFor"></span><div id="library-target" aria-labelledby="library-target-label"></div><button disabled id="use-selection" class="primary" data-t="useMaterial"></button></div></div>
 </section>
 <section id="record-detail" hidden><p id="record-error" class="record-error" role="status" hidden></p><div id="output-list" class="record-results" role="group"></div><p id="no-output" class="help" hidden></p></section>
 <div id="record-menu" class="context-menu" role="menu" hidden></div>

</main></div>
<input disabled id="material-picker" type="file" multiple hidden>
<dialog id="confirm" class="modal-standard" aria-labelledby="confirm-title" aria-describedby="confirm-text"><form method="dialog"><header class="modal-header"><h2 id="confirm-title" class="modal-title"></h2></header><div class="modal-body"><p id="confirm-text"></p></div><footer class="modal-actions"><button disabled value="cancel" class="btn" data-t="cancel"></button><button disabled value="confirm" class="btn btn-danger"></button></footer></form></dialog>
<dialog id="library-editor" class="modal modal-standard" aria-labelledby="library-edit-title"><form id="library-edit-form"><header class="modal-header"><h2 class="modal-title" id="library-edit-title"></h2></header><div class="modal-body"><div class="form-row"><label for="library-name" data-t="materialName"></label><input disabled class="form-input" type="text" id="library-name" maxlength="80" required></div><div class="form-row"><label for="library-brief" data-t="prompts"></label><textarea disabled class="form-input" id="library-brief" rows="5" maxlength="40000"></textarea></div><div id="library-edit-assets" class="record-assets"></div><p id="library-edit-error" class="help" role="alert"></p></div><footer class="modal-actions"><button disabled type="button" id="library-edit-cancel" class="btn" data-t="cancel"></button><button disabled type="submit" id="library-save" class="btn btn-primary" data-t="saveMaterial"></button></footer></form></dialog>
<dialog id="library-detail" class="modal-standard" aria-labelledby="library-detail-name"><header class="modal-header"><h2 id="library-detail-name" class="modal-title"></h2><button disabled id="library-detail-close" type="button" class="modal-close-btn" data-icon="x"></button></header><pre id="library-detail-brief"></pre><div id="library-detail-assets" class="record-assets"></div><footer class="modal-actions"><button disabled id="library-detail-edit" class="btn" data-t="edit"></button><button disabled id="library-detail-use" class="btn btn-primary" data-t="useMaterial"></button></footer></dialog>
<dialog id="media-preview" class="modal-standard" aria-labelledby="media-name"><div class="modal-header"><h2 id="media-name" class="modal-title"></h2><button disabled id="media-close" type="button" class="modal-close-btn" data-icon="x"></button></div><div id="media-content" class="preview" role="status"></div><div class="actions"><button disabled id="media-retry" data-t="retry" hidden></button></div></dialog>
<script src="/__orkas/sdk.js"></script><script src="locales.js"></script><script src="icons.js"></script><script src="controls.js"></script><script src="model.js"></script><script src="app.js"></script>
</body></html>
