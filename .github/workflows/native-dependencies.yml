name: Windows sandbox fixture diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-fixture:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Observe original and exit-based sandbox fixtures
        run: npm run test:js -- --maxWorkers=1 src/core-agent/test/sandbox.test.ts src/core-agent/test/process-session.test.ts
