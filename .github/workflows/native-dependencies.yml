name: Windows PowerShell baseline diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Measure PowerShell with the actual sandbox environment in Node
        run: node --import tsx scripts/windows-shell-baseline.mts
      - name: Measure PowerShell with the actual sandbox environment in Electron
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: .\node_modules\electron\dist\electron.exe --import=tsx scripts/windows-shell-baseline.mts
      - name: Reproduce the existing Windows sandbox cases on main
        run: >-
          npm run test:js -- --maxWorkers=1 src/core-agent/test/sandbox.test.ts
          -t 'executes a simple command|prints a blocked command name|reports duration'
