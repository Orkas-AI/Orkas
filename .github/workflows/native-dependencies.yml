name: Windows verification for selected desktop fixes
on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked native dependencies
        run: npm ci --include=optional
      - name: Start the desktop app and verify HTML fragment auditing
        if: success() || failure()
        run: >-
          npm run test:e2e --
          test/e2e/html_preview_e2e_generated_controls.spec.ts
          --grep "audits fragment links"
          --workers=1 --output=test-results/windows-fragments
      - name: Retain Electron diagnostic summaries
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem test-results -Recurse -Filter electron-log-analysis.json -ErrorAction SilentlyContinue |
            ForEach-Object {
              $summary = Get-Content $_.FullName -Raw | ConvertFrom-Json
              [pscustomobject]@{ journey = $_.Directory.Name; passed = $summary.passed; levels = $summary.levelCounts; captured = $summary.capturedLineCount; analyzed = $summary.analyzedLineCount } |
                ConvertTo-Json -Depth 4 -Compress
            }
