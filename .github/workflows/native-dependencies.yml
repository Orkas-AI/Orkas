name: Windows shell fixture host setup proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shell-test:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Test both original owners with Windows PowerShell module directories
        shell: pwsh
        run: |
          $previousModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'User')
          $system = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $shared = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          $user = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'WindowsPowerShell\Modules'
          try {
            [Environment]::SetEnvironmentVariable('PSModulePath', "$user;$shared;$system", 'User')
            npm run test:js -- --maxWorkers=1 src/core-agent/test/sandbox.test.ts src/core-agent/test/process-session.test.ts
            $result = $LASTEXITCODE
          } finally {
            [Environment]::SetEnvironmentVariable('PSModulePath', $previousModulePath, 'User')
            if ([Environment]::GetEnvironmentVariable('PSModulePath', 'User') -ne $previousModulePath) {
              throw 'Windows module path was not restored'
            }
            Write-Host 'Restored the original Windows module path setting'
          }
          exit $result
