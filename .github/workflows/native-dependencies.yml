name: Windows verification for selected runtime fixes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked native dependencies
        run: npm ci --include=optional
      - name: Verify automation moves and browser navigation state
        run: >-
          npm run test:js -- --maxWorkers=1
          test/main/features/auto_tasks_tool.test.ts
          test/main/features/web-assist-control.test.ts
      - name: Fetch and verify the pinned OfficeCLI binary
        if: success() || failure()
        run: npm run officecli:fetch
      - name: Confirm native Word table coverage and recovery
        if: success() || failure()
        run: >-
          npm run test:js -- --maxWorkers=1
          test/main/features/office/office-readonly_e2e.test.ts
          -t "marks omitted Word table"
