name: Exact PR head Intel attachment type check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  intel-types:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8574d33f4100e7aa68a9ed226852931ad5259eb9
      - name: Verify the pinned PR checkout
        run: test "$(git rev-parse HEAD)" = 8574d33f4100e7aa68a9ed226852931ad5259eb9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run native:repair
      - name: Verify the locked manifests
        run: git diff --exit-code -- package.json package-lock.json
      - name: Type-check portable attachment journeys
        run: npm run test:e2e:typecheck
