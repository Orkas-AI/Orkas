<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orkas HTML 测试页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#172538;font:16px/1.65 system-ui,sans-serif}
main{max-width:880px;margin:40px auto;padding:32px;background:white;border:1px solid #dce3ed;border-radius:16px}
h1{font-size:28px;margin:8px 0 12px}.tag{color:#286452;font-weight:600;font-size:13px}p{color:#526377}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.card{border:1px solid #dce3ed;border-radius:10px;padding:20px}
button{border:0;border-radius:8px;background:#2458d3;color:white;padding:10px 18px;font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #81b3ff;outline-offset:3px}output{display:block;font-size:30px;font-weight:700;margin:10px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce3ed}th{background:#f4f7fb}
svg{width:100%;height:115px}.note{font-size:13px}@media(max-width:600px){main{margin:16px;padding:20px}.cards{grid-template-columns:1fr}h1{font-size:24px}}
</style></head>
<body><main><div class="tag">ORKAS · 离线 HTML 测试</div><h1>中文页面与本地交互</h1>
<p>应看到完整页面、两张卡片、下方表格。此文件不依赖外部图片、字体或脚本。</p>
<div class="cards"><section class="card"><strong>按钮交互</strong><output id="count" aria-live="polite">0</output>
<button id="increment" type="button">点击加一</button><p class="note">点击 3 次，应显示 3。</p></section>
<section class="card"><strong>内嵌 SVG 图形</strong><svg viewBox="0 0 300 115" role="img" aria-label="三根蓝绿色柱形">
<rect x="25" y="60" width="55" height="40" fill="#2458d3"/><rect x="120" y="35" width="55" height="65" fill="#3478db"/><rect x="215" y="10" width="55" height="90" fill="#209d80"/></svg></section></div>
<table><thead><tr><th>项目</th><th>数量</th></tr></thead><tbody><tr><td>中文测试 A</td><td>12</td></tr><tr><td>中文测试 B</td><td>3</td></tr><tr><td>合计</td><td>15</td></tr></tbody></table>
<p class="note">资料库默认应显示 HTML 源码；独立预览应显示此网页。切换窄窗口时，卡片应上下排列。</p>
</main><script>document.getElementById('increment').addEventListener('click',function(){const counter=document.getElementById('count');counter.textContent=String(Number(counter.textContent)+1);});</script></body></html>
