<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词匣 · 单词卡片</title>
  <style>
    :root { --ink:#18253c; --muted:#66758d; --paper:#f7f8fc; --panel:#fff; --primary:#3d55e8; --primary-dark:#293ec2; --mint:#dff7ec; --mint-ink:#14734c; --amber:#fff0c8; --amber-ink:#9c6612; --line:#e1e6f0; --shadow:0 18px 45px rgba(39,57,96,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 8% 5%,#e0e7ff 0,transparent 27rem),radial-gradient(circle at 96% 90%,#d8f7ef 0,transparent 30rem),var(--paper); font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #8c9aff; outline-offset:3px; }
    .shell { width:min(1120px,calc(100% - 40px)); margin:0 auto; padding:42px 0 52px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.04em; font-size:1.28rem; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; color:white; background:var(--primary); border-radius:14px; box-shadow:0 8px 20px #a8b4fa; font-size:1.3rem; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; }.status-dot { width:8px;height:8px;border-radius:50%;background:#37b879; }
    .hero { display:grid; grid-template-columns:1.35fr .65fr; gap:20px; margin-bottom:20px; }
    .intro,.progress,.adder,.review { background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.9); box-shadow:var(--shadow); border-radius:24px; }
    .intro { padding:32px; }.eyebrow { margin:0 0 8px;color:var(--primary);font-size:.8rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase; }.intro h1 { margin:0; font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.06em;line-height:1.08; }.intro p { max-width:56ch; color:var(--muted); margin:16px 0 0; }
    .progress { padding:25px; display:flex; flex-direction:column; justify-content:center; }.progress h2,.review h2 { font-size:1rem;margin:0 0 16px; }.meter { height:12px;background:#edf0f7;border-radius:999px;overflow:hidden; }.meter > span { display:block;height:100%;width:0;background:linear-gradient(90deg,#45c997,#23a876);border-radius:inherit;transition:width .35s ease; }.stats { display:flex;justify-content:space-between; gap:8px;margin-top:18px; }.stat strong{display:block;font-size:1.6rem;letter-spacing:-.05em}.stat span{font-size:.8rem;color:var(--muted)}
    main { display:grid;grid-template-columns:390px 1fr;gap:20px;align-items:start; }.adder,.review { padding:25px; }.adder h2 { margin:0 0 4px;font-size:1.2rem; }.adder > p { margin:0 0 20px;color:var(--muted);font-size:.9rem; } label { display:block; margin:0 0 14px;font-weight:700;font-size:.9rem; } input,textarea,select { display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink); } textarea { min-height:74px;resize:vertical; }.form-footer { display:flex;align-items:center;justify-content:space-between;gap:12px; }.hint {font-size:.78rem;color:var(--muted)}.primary { padding:11px 15px;border:0;border-radius:11px;background:var(--primary);color:white;font-weight:800;box-shadow:0 5px 12px #d2d8ff; }.primary:hover{background:var(--primary-dark)}
    .review-head { display:flex;align-items:start;justify-content:space-between;gap:12px; }.review-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}.filter { width:auto;min-width:132px;margin:0; }.card-stage{ perspective:1000px;margin-top:22px; }.flashcard { position:relative; min-height:330px; transform-style:preserve-3d; transition:transform .55s ease; cursor:pointer; }.flashcard.flipped{transform:rotateY(180deg)}.card-face { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;border-radius:20px;backface-visibility:hidden;box-shadow:0 10px 24px rgba(32,48,84,.1); }.front {background:linear-gradient(145deg,#465eee,#2e42c7);color:white}.back {background:#fff;transform:rotateY(180deg);border:1px solid var(--line)}.card-label {align-self:flex-start;font-size:.8rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;opacity:.78}.word {margin:auto;font-size:clamp(2.4rem,6vw,4.5rem);font-weight:850;letter-spacing:-.06em}.click-tip{font-size:.84rem;opacity:.8}.meaning {font-size:1.65rem;font-weight:800;letter-spacing:-.03em}.example{margin:15px 0 auto;color:var(--muted);font-style:italic;max-width:38ch}.tag {align-self:flex-start;margin-top:14px;padding:4px 9px;border-radius:99px;font-size:.76rem;font-weight:800;background:var(--amber);color:var(--amber-ink)}.tag.mastered{background:var(--mint);color:var(--mint-ink)}
    .actions { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px }.action { padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--ink)}.action:hover{background:#f4f6ff}.action.not-yet{color:#a16608;border-color:#f1d69b;background:#fffbef}.action.master{color:#14734c;border-color:#aee2ca;background:#f2fcf7}.empty { min-height:330px;display:grid;place-items:center;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px;padding:25px; }.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width:780px){.shell{width:min(100% - 28px,620px);padding-top:24px} header{margin-bottom:20px}.hero,main{grid-template-columns:1fr}.intro{padding:26px}.progress{padding:22px}.adder,.review{padding:20px}.review-head{flex-wrap:wrap}.filter{width:100%}.flashcard{min-height:300px}.status{display:none}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><span class="brand-mark" aria-hidden="true">文</span>词匣</div><div class="status"><span class="status-dot"></span>学习进度已保存</div></header>
    <section class="hero" aria-labelledby="page-title"><div class="intro"><p class="eyebrow">今日复习</p><h1 id="page-title">记住每一个<br>值得记住的词。</h1><p>添加你的词汇卡片，先复习还不熟悉的单词。点击卡片翻面，再诚实地记录掌握程度。</p></div><aside class="progress" aria-label="学习进度"><h2>掌握进度</h2><div class="meter" aria-hidden="true"><span id="meterFill"></span></div><div class="stats"><div class="stat"><strong id="masteredCount">0</strong><span>已掌握</span></div><div class="stat"><strong id="remainingCount">0</strong><span>待复习</span></div><div class="stat"><strong id="totalCount">0</strong><span>总词汇</span></div></div></aside></section>
    <main>
      <section class="adder" aria-labelledby="add-title"><h2 id="add-title">添加新卡片</h2><p>每张卡片都保存在当前浏览器中。</p><form id="wordForm"><label>单词<input id="word" name="word" required maxlength="60" placeholder="例如：serendipity" autocomplete="off" /></label><label>释义<textarea id="meaning" name="meaning" required maxlength="240" placeholder="用自己的话解释它"></textarea></label><label>例句（可选）<textarea id="example" name="example" maxlength="300" placeholder="例如：A happy accident led to the discovery."></textarea></label><div class="form-footer"><span class="hint">* 单词和释义为必填</span><button class="primary" type="submit">加入卡片</button></div></form></section>
      <section class="review" aria-labelledby="review-title"><p id="actionFeedback" class="sr-only" aria-live="polite"></p><div class="review-head"><div><h2 id="review-title">复习队列</h2><p id="queueNote">未掌握的单词会优先出现。</p></div><label class="sr-only" for="filter">筛选卡片</label><select id="filter" class="filter"><option value="all">全部卡片</option><option value="unmastered">仅待复习</option><option value="mastered">仅已掌握</option></select></div><div id="cardArea"></div><div class="actions" id="actions"><button class="action not-yet" type="button" id="notYet">还不熟悉</button><button class="action master" type="button" id="master">已经掌握</button></div></section>
    </main>
  </div>
  <script>
    const STORAGE_KEY='word-chest-cards-v1';
    const sample=[
      {id:'sample-1',word:'serendipity',meaning:'意外发现美好事物的幸运',example:'Finding that little bookshop was pure serendipity.',mastered:false,created:1},
      {id:'sample-2',word:'resilient',meaning:'有韧性的；能迅速恢复的',example:'Children are often more resilient than we expect.',mastered:false,created:2},
      {id:'sample-3',word:'eloquent',meaning:'有说服力且表达流畅的',example:'Her eloquent speech moved the audience.',mastered:true,created:3}
    ];
    let cards=[];let index=0;let flipped=false;
    const $=id=>document.getElementById(id);
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));cards=Array.isArray(saved)?saved:sample}catch{cards=sample}save();}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cards));}
    function visibleCards(){const filter=$('filter').value;return cards.filter(c=>filter==='all'||(filter==='mastered'?c.mastered:!c.mastered)).sort((a,b)=>Number(a.mastered)-Number(b.mastered)||b.created-a.created);}
    function render(){const list=visibleCards();if(index>=list.length)index=0;const card=list[index];const mastered=cards.filter(c=>c.mastered).length;const total=cards.length;$('masteredCount').textContent=mastered;$('remainingCount').textContent=total-mastered;$('totalCount').textContent=total;$('meterFill').style.width=total?(mastered/total*100)+'%':'0%';$('queueNote').textContent=list.length?`当前队列 ${index+1} / ${list.length} · 未掌握的单词优先出现。`:'这个筛选条件下没有卡片。';
      if(!card){$('cardArea').innerHTML='<div class="empty"><div><strong>这里还没有卡片</strong>换一个筛选条件，或在左侧添加新单词。</div></div>';$('actions').hidden=true;return;}$('actions').hidden=false;const safe=v=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));$('cardArea').innerHTML=`<div class="card-stage"><div class="flashcard ${flipped?'flipped':''}" id="flashcard" role="button" tabindex="0" aria-label="${flipped?'显示单词':'显示释义'}：${safe(card.word)}"><article class="card-face front"><span class="card-label">单词</span><div class="word">${safe(card.word)}</div><span class="click-tip">点击翻卡查看答案</span></article><article class="card-face back"><span class="card-label">释义与例句</span><div class="meaning">${safe(card.meaning)}</div>${card.example?`<p class="example">“${safe(card.example)}”</p>`:'<p class="example">尚未添加例句</p>'}<span class="tag ${card.mastered?'mastered':''}">${card.mastered?'已掌握':`待复习 · 已复习 ${card.reviewed||0} 次`}</span></article></div></div>`;const flash=$('flashcard');flash.addEventListener('click',toggle);flash.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});}
    function toggle(){flipped=!flipped;render();}
    function current(){return visibleCards()[index];}
    function setMastery(value){const active=current();if(!active)return;const actual=cards.find(c=>c.id===active.id);actual.mastered=value;actual.reviewed=(actual.reviewed||0)+1;save();flipped=false;index=0;render();$('actionFeedback').textContent=value?`${actual.word} 已标记为掌握。`:`${actual.word} 已保留在待复习队列（第 ${actual.reviewed} 次复习）。`;}
    $('wordForm').addEventListener('submit',e=>{e.preventDefault();const word=$('word').value.trim(),meaning=$('meaning').value.trim(),example=$('example').value.trim();if(!word||!meaning)return;cards.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),word,meaning,example,mastered:false,created:Date.now()});save();e.target.reset();$('filter').value='all';index=0;flipped=false;render();$('word').focus();});
    $('filter').addEventListener('change',()=>{index=0;flipped=false;render();});$('notYet').addEventListener('click',()=>setMastery(false));$('master').addEventListener('click',()=>setMastery(true));load();render();
  </script>
</body>
</html>
